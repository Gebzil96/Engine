[tool.ruff]
target-version = "py312"
line-length = 100

# Базовый набор: ошибки + потенциальные баги + импорт-стайл
lint.select = ["E", "F", "I"]
lint.fixable = ["ALL"]

# Чтобы Ruff не лез в виртуальное окружение/кэш
exclude = [
  ".venv",
  "venv",
  "__pycache__",
  ".ruff_cache",
  "logs",
]

[tool.ruff.format]
# Ruff будет и форматировать код (ruff format)
line-ending = "auto"
